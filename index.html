function applyLang(lang) {
  const t = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  document.getElementById("tag").textContent = t.tag;
  document.getElementById("nav-privacy").textContent = t.navPrivacy;
  document.getElementById("nav-support").textContent = t.navSupport;
  document.getElementById("nav-about").textContent = t.navAbout;
  document.getElementById("about").innerHTML = t.about;
  document.getElementById("privacy").innerHTML = t.privacy;
  document.getElementById("support").innerHTML = t.support;
  document.getElementById("footer").innerHTML = "<p>" + t.footer + "</p>";
  document.querySelectorAll(".langbar button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang));
  try { localStorage.setItem("bibiba-lang", lang); } catch (e) {}
}

document.querySelectorAll(".langbar button").forEach(b =>
  b.addEventListener("click", () => applyLang(b.dataset.lang)));

// Pick initial language: saved choice → browser language → English.
let initial = "en";
try { initial = localStorage.getItem("bibiba-lang") || ""; } catch (e) {}
if (!initial) {
  const nav = (navigator.language || "en").slice(0, 2);
  initial = ["en", "ru", "es"].includes(nav) ? nav : "en";
}
applyLang(initial);
</script>
